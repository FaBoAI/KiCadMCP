[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fabo-kicad-mcp"
version = "0.1.0"
description = "Local MCP and CLI tools for KiCad inspection, manufacturing export and SPICE analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
geometry = ["shapely>=2,<3"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "build>=1,<2"]

[project.scripts]
kicad-mcp = "kicad_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires separately installed KiCad or SPICE programs"]
